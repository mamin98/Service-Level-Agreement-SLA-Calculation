<h2>SLA Calculate</h2>
<ul>
  <li *ngFor="let sla of slaList">
    {{ sla.name }} - {{ sla.captureDateTime }} - {{ sla.priority }} - Deadline: {{ sla.deadline }}
  </li>
</ul>

<h3>Add SLA</h3>
<input [(ngModel)]="newSla.name" placeholder="Name" class="input-margin" />
<input [(ngModel)]="newSla.captureDateTime" placeholder="Capture DateTime" class="input-margin" />

<select [(ngModel)]="newSla.priority" class="input-margin">
  <option *ngFor="let p of priorityTypes" [value]="p.value">
    {{ p.name }}
  </option>
</select>

<button (click)="addSla()" class="input-margin">Add</button>
